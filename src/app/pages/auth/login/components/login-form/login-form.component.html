@if(error().show){
<div class="absolute top-10 right-10 z-50 animate-slide-in">
  <app-error-alert></app-error-alert>
</div>
}
<div class="mx-auto w-full justify-center space-y-6 sm:w-[350px]">
  <div class="space-y-2 text-center">
    <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
    <p class="text-muted-foreground text-sm">
      Welcome back! Your dashboard is ready—analyze, optimize, and grow your
      business with ease.
    </p>
  </div>
  <div class="grid gap-6">
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <hlm-form-field class="pb-4">
        <label hlmLabel class="sr-only" for="email">Email</label>
        <input
          hlmInput
          class="w-full"
          placeholder="Email"
          type="email"
          id="email"
          formControlName="email"
        />
      </hlm-form-field>
      <hlm-form-field class="pb-4">
        <label hlmLabel class="sr-only" for="password">Password</label>
        <input
          hlmInput
          class="w-full"
          placeholder="Password"
          type="password"
          formControlName="password"
          id="password"
        />
      </hlm-form-field>
      <button hlmBtn [disabled]="isLoading()" class="mt-2 w-full" type="submit">
        @if (isLoading()) {
        <ng-icon
          hlm
          name="lucideLoaderCircle"
          size="sm"
          class="mr-2 animate-spin"
        />
        } Sign In
      </button>
    </form>
  </div>
</div>
